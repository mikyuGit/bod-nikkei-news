name: Government-guaranteed loan calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/guaranteed-loans.yml
      - scripts/guaranteed_loans.py
      - scripts/test_guaranteed_loans.py

permissions:
  contents: read
  id-token: write

concurrency:
  group: government-guaranteed-loan-calendar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PDF text reader if needed
        shell: bash
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends poppler-utils
          fi
      - name: Check loan parsers
        run: python3 scripts/test_guaranteed_loans.py
      - name: Collect official loan notices and hand off calendar
        run: python3 scripts/guaranteed_loans.py
